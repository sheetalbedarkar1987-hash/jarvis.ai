<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS AI</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0e1626;
      --accent: #00e5ff;
      --accent2: #3b82f6;
      --text: #e6f1ff;
      --muted: #8aa0be;
      --border: rgba(0, 229, 255, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #10203a 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 820px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .brand { font-size: 1.35rem; font-weight: 700; letter-spacing: 2px; color: var(--accent); }
    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .grid-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .card {
      background: rgba(7, 11, 20, 0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .card label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      background: #09101d;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .expr-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    button {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #04101c;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.ghost {
      background: #121d33;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 6px 10px;
      font-size: 0.78rem;
    }
    button.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .chat {
      height: 300px;
      overflow-y: auto;
      background: rgba(7, 11, 20, 0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg { max-width: 85%; padding: 10px 12px; border-radius: 10px; font-size: 0.92rem; line-height: 1.4; }
    .msg.user { align-self: flex-end; background: #1d3b66; color: #fff; }
    .msg.bot { align-self: flex-start; background: #111c30; border: 1px solid var(--border); color: var(--text); }
    .composer { display: flex; gap: 8px; }
    .composer input { flex: 1; }
    .status-line { font-size: 0.78rem; color: var(--muted); min-height: 18px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">JARVIS AI</div>
      <div class="badge" id="modeBadge">Standalone Web Mode</div>
    </div>

    <div class="grid-controls">
      <div class="card">
        <label>ESP32-C3 IP (Optional)</label>
        <div style="display:flex; gap:6px;">
          <input id="espIp" type="text" placeholder="192.168.1.50" />
          <button class="ghost" onclick="saveIp()">Save</button>
        </div>
      </div>

      <div class="card">
        <label>AI Brain Source</label>
        <select id="brainMode" onchange="updateBadge()">
          <option value="builtin">Built-in JARVIS (Works Anywhere, No PC)</option>
          <option value="ollama">Local Ollama (http://localhost:11434)</option>
        </select>
      </div>
    </div>

    <div class="card">
      <label>ESP32 Expression Trigger</label>
      <div class="expr-row" id="exprButtons"></div>
    </div>

    <div class="chat" id="chatBox">
      <div class="msg bot">Hello, hi there. I am JARVIS. Ask me anything in English or Hinglish.</div>
    </div>

    <div class="composer">
      <button class="ghost" id="micBtn" onclick="startVoiceInput()" title="Speak">Mic</button>
      <input id="promptInput" type="text" placeholder="Type or speak to JARVIS..." onkeydown="if(event.key==='Enter') sendPrompt()" />
      <button onclick="sendPrompt()">Send</button>
    </div>

    <div class="status-line" id="statusLine">Ready.</div>
  </div>

  <script>
    const EXPRESSIONS = ["neutral", "happy", "speaking", "thinking", "surprised", "focused", "sad", "skeptic"];
    const chatBox = document.getElementById("chatBox");
    const statusLine = document.getElementById("statusLine");
    const espIpInput = document.getElementById("espIp");
    const promptInput = document.getElementById("promptInput");

    espIpInput.value = localStorage.getItem("jarvis_esp_ip") || "";

    const exprContainer = document.getElementById("exprButtons");
    EXPRESSIONS.forEach((ex) => {
      const btn = document.createElement("button");
      btn.className = "ghost";
      btn.textContent = ex;
      btn.onclick = () => sendExpression(ex, "none");
      exprContainer.appendChild(btn);
    });

    function saveIp() {
      localStorage.setItem("jarvis_esp_ip", espIpInput.value.trim());
      setStatus("ESP32 IP saved.");
    }

    function updateBadge() {
      const mode = document.getElementById("brainMode").value;
      document.getElementById("modeBadge").textContent =
        mode === "ollama" ? "Local Ollama Mode" : "Standalone Web Mode";
    }

    function setStatus(msg) {
      statusLine.textContent = msg;
    }

    function addMsg(text, who) {
      const div = document.createElement("div");
      div.className = `msg ${who}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakJarvis(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.pitch = 0.68; // Deeper voice tone
      utter.rate = 0.94;  // Calm, measured pace
      utter.volume = 1.0;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find((v) =>
        /david|george|daniel|mark|male|english/i.test(v.name)
      );
      if (preferred) utter.voice = preferred;
      window.speechSynthesis.speak(utter);
    }

    async function sendExpression(expression, sound = "none") {
      const ip = espIpInput.value.trim();
      if (!ip) return;
      try {
        await fetch(`http://${ip}/api/expression`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ expression, sound }),
        });
        setStatus(`Sent expression '${expression}' to ${ip}`);
      } catch (e) {
        setStatus(`ESP32 reach failed (${ip}): ${e.message}`);
      }
    }

    async function sendSayToEsp(text, expression = "speaking") {
      const ip = espIpInput.value.trim();
      if (!ip) return;
      const safeOled = text.replace(/[^\x20-\x7E]/g, "").slice(0, 74) || "JARVIS";
      try {
        await fetch(`http://${ip}/api/say`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: safeOled,
            header: "JARVIS",
            expression,
            sound: "ai",
            duration: 8000,
          }),
        });
      } catch (_) {}
    }

    function builtinReply(q) {
      const s = q.toLowerCase();
      if (s.includes("hello") || s.includes("hi") || s.includes("namaste")) {
        return "Hello there. JARVIS is online and ready to assist.";
      }
      if (s.includes("time")) {
        return `Current local time is ${new Date().toLocaleTimeString()}.`;
      }
      if (s.includes("who are you") || s.includes("naam")) {
        return "I am JARVIS, your personal desktop and web AI assistant.";
      }
      return `Understood: "${q}". Running in standalone browser mode without a local server.`;
    }

    async function askBrain(q) {
      const mode = document.getElementById("brainMode").value;
      if (mode === "ollama") {
        const res = await fetch("http://localhost:11434/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "qwen2.5:1.5b",
            prompt: `Reply in 1-2 short sentences: ${q}`,
            stream: false,
          }),
        });
        const data = await res.json();
        return (data.response || "").trim() || builtinReply(q);
      }
      return builtinReply(q);
    }

    async function sendPrompt() {
      const q = promptInput.value.trim();
      if (!q) return;
      promptInput.value = "";
      addMsg(q, "user");
      setStatus("Thinking...");
      await sendExpression("thinking", "think");

      try {
        const reply = await askBrain(q);
        addMsg(reply, "bot");
        setStatus("Speaking...");
        await sendSayToEsp(reply, "speaking");
        speakJarvis(reply);
        setTimeout(() => sendExpression("happy", "none"), 2200);
        setStatus("Ready.");
      } catch (err) {
        const fallback = builtinReply(q);
        addMsg(fallback, "bot");
        speakJarvis(fallback);
        setStatus(`Fallback used: ${err.message}`);
      }
    }

    function startVoiceInput() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        setStatus("Voice input not supported in this browser.");
        return;
      }
      const rec = new SR();
      rec.lang = "en-IN";
      setStatus("Listening...");
      rec.onresult = (ev) => {
        promptInput.value = ev.results[0][0].transcript;
        sendPrompt();
      };
      rec.onerror = (ev) => setStatus(`Mic error: ${ev.error}`);
      rec.start();
    }
  </script>
</body>
</html>
