<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS AI - Multi Voice</title>
  <style>
    :root {
      --bg: #050911;
      --panel: #0c1424;
      --accent: #00e5ff;
      --accent2: #2563eb;
      --text: #eef5ff;
      --muted: #8ea4c2;
      --border: rgba(0, 229, 255, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #102447 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .app {
      width: 100%;
      max-width: 820px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .top-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: flex-end;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 175px;
      max-width: 240px;
    }
    .field input, .assistant-bar select {
      width: 100%;
      background: #070d19;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.84rem;
      outline: none;
    }
    .field input:focus, .assistant-bar select:focus {
      border-color: var(--accent);
    }
    .assistant-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(7, 13, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .assistant-bar label {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .assistant-bar select {
      flex: 1;
      min-width: 220px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.on {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .chat {
      height: 340px;
      overflow-y: auto;
      background: rgba(5, 9, 17, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #ffffff;
    }
    .msg.bot {
      align-self: flex-start;
      background: #111d33;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .composer {
      display: flex;
      gap: 8px;
    }
    .composer input {
      flex: 1;
      background: #070d19;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      outline: none;
    }
    .composer input:focus {
      border-color: var(--accent);
    }
    button {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #03101d;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    button.mic, button.small-btn {
      background: #132038;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 7px 12px;
      font-size: 0.82rem;
    }
    button.mic.active {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title" id="brandTitle">JARVIS AI</div>
      <div class="top-inputs">
        <div class="field">
          <span class="dot" id="keyDot" title="API Key"></span>
          <input id="apiKey" type="password" placeholder="Put your API key" />
        </div>
        <div class="field">
          <span class="dot" id="localDot" title="ESP32 Local Address"></span>
          <input id="localAddr" type="text" placeholder="Put your local address" />
        </div>
      </div>
    </div>

    <div class="assistant-bar">
      <label for="assistantSelect">Assistant Voice:</label>
      <select id="assistantSelect"></select>
      <button class="small-btn" id="testVoiceBtn" type="button">Test Voice</button>
      <button class="small-btn" id="voiceBtn" type="button">Voice: ON</button>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">JARVIS online. Choose any of the 10 voices above, put your API key, and ask in Hindi or English!</div>
    </div>

    <div class="composer">
      <button class="mic" id="micBtn" type="button">Mic</button>
      <input id="prompt" type="text" placeholder="Ask in English, Hindi, or Hinglish..." />
      <button id="sendBtn" type="button">Send</button>
    </div>

    <div class="footer-bar">
      <span id="voiceInfo">Language: Auto (Hindi + English)</span>
      <span id="status">Waiting for API key</span>
    </div>
  </div>
