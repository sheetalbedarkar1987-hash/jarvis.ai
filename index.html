<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS AI</title>
  <style>
    :root {
      --bg: #060a12;
      --panel: #0d1525;
      --accent: #00e5ff;
      --accent2: #2563eb;
      --text: #eaf3ff;
      --muted: #8ea4c2;
      --border: rgba(0, 229, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #102240 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .app {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .inputs-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: flex-end;
    }
    .box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 195px;
      flex: 1;
      max-width: 260px;
    }
    .box input {
      width: 100%;
      background: #070d19;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.84rem;
      outline: none;
    }
    .box input:focus { border-color: var(--accent); }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.ready { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .chat {
      height: 350px;
      overflow-y: auto;
      background: rgba(6, 10, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 84%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff;
    }
    .msg.bot {
      align-self: flex-start;
      background: #111d33;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .composer {
      display: flex;
      gap: 8px;
    }
    .composer input {
      flex: 1;
      background: #070d19;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    button {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #03101d;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.mic {
      background: #132038;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    button.mic.active {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }
    .status {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">JARVIS AI</div>
      <div class="inputs-row">
        <div class="box">
          <span class="dot" id="keyDot" title="API Key Status"></span>
          <input id="apiKey" type="password" placeholder="Put your API key" oninput="handleKeyInput()" />
        </div>
        <div class="box">
          <span class="dot" id="localDot" title="Local Address Status"></span>
          <input id="localAddr" type="text" placeholder="Put your local address" oninput="handleLocalInput()" />
        </div>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">Put your API key and local address above, then ask anything.</div>
    </div>

    <div class="composer">
      <button class="mic" id="micBtn" onclick="toggleMic()">Mic</button>
      <input id="prompt" type="text" placeholder="Ask JARVIS..." onkeydown="if(event.key==='Enter') askJarvis()" />
      <button onclick="askJarvis()">Send</button>
    </div>

    <div class="status" id="status">Waiting for API key</div>
  </div>

  <script>
    const apiKeyEl = document.getElementById("apiKey");
    const localAddrEl = document.getElementById("localAddr");
    const keyDot = document.getElementById("keyDot");
    const localDot = document.getElementById("localDot");
    const chatEl = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const statusEl = document.getElementById("status");
    const micBtn = document.getElementById("micBtn");

    let busy = false;
    let listening = false;
    let recognition = null;
    let activeModel = "";
    let history = [];

    apiKeyEl.value = localStorage.getItem("jarvis_key") || "";
    localAddrEl.value = localStorage.getItem("jarvis_local_addr") || "";
    updateLocalDot();
    if (apiKeyEl.value.trim().length > 10) detectBestModel();

    function normalizeBaseUrl(raw) {
      let val = (raw || "").trim();
      if (!val) return "";
      val = val.replace(/\/+$/, "");
      if (!/^https?:\/\//i.test(val)) {
        val = "http://" + val;
      }
      return val;
    }

    function handleLocalInput() {
      localStorage.setItem("jarvis_local_addr", localAddrEl.value.trim());
      updateLocalDot();
    }

    function updateLocalDot() {
      const hasAddr = localAddrEl.value.trim().length > 6;
      localDot.classList.toggle("ready", hasAddr);
    }

    function handleKeyInput() {
      const val = apiKeyEl.value.trim();
      localStorage.setItem("jarvis_key", val);
      activeModel = "";
      if (val.length > 10) {
        detectBestModel();
      } else {
        keyDot.classList.remove("ready");
        statusEl.textContent = "Put your API key above";
      }
    }

    async function sendEspExpression(expression, sound = "none") {
      const base = normalizeBaseUrl(localAddrEl.value);
      if (!base) return;
      try {
        await fetch(`${base}/api/expression`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ expression, sound })
        });
      } catch (_) {}
    }

    async function sendEspSay(text, expression = "speaking") {
      const base = normalizeBaseUrl(localAddrEl.value);
      if (!base) return;
      const safeOled = String(text || "").replace(/[^\x20-\x7E]/g, "").slice(0, 74) || "JARVIS";
      try {
        await fetch(`${base}/api/say`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: safeOled,
            header: "JARVIS",
            expression,
            sound: "ai",
            duration: 8000
          })
        });
      } catch (_) {}
    }

    async function detectBestModel() {
      const key = apiKeyEl.value.trim();
      if (!key) return "openai/gpt-oss-20b";
      if (activeModel) return activeModel;

      statusEl.textContent = "Connecting...";
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${key}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || "Invalid API key");

        const ids = (data.data || []).map(m => m.id).filter(Boolean);
        const preferred = [
          "openai/gpt-oss-20b",
          "openai/gpt-oss-120b",
          "qwen/qwen3.8-27b",
          "llama-3.3-70b-versatile",
          "llama-3.1-8b-instant"
        ];
        const chatModels = ids.filter(id => !/whisper|guard|orpheus|tts|embed/i.test(id));
        activeModel = preferred.find(p => chatModels.includes(p)) || chatModels[0] || "openai/gpt-oss-20b";

        keyDot.classList.add("ready");
        statusEl.textContent = `Ready (${activeModel})`;
        return activeModel;
      } catch (e) {
        keyDot.classList.remove("ready");
        statusEl.textContent = `Key error: ${e.message}`;
        return "openai/gpt-oss-20b";
      }
    }

    function addBubble(text, role) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.pitch = 0.72;
      u.rate = 0.96;
      const voices = window.speechSynthesis.getVoices();
      const male = voices.find(v => /david|george|daniel|mark|male|english/i.test(v.name));
      if (male) u.voice = male;
      window.speechSynthesis.speak(u);
    }

    async function askJarvis(spokenText = "") {
      if (busy) return;
      const key = apiKeyEl.value.trim();
      const q = (spokenText || promptEl.value).trim();
      if (!q) return;

      if (!key) {
        addBubble("Pehle upar 'Put your API key' wale box mein apni API key paste karo.", "bot");
        return;
      }

      if (!spokenText) promptEl.value = "";
      busy = true;
      addBubble(q, "user");
      statusEl.textContent = "Thinking...";
      sendEspExpression("thinking", "think");

      try {
        const model = await detectBestModel();
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${key}`
          },
          body: JSON.stringify({
            model,
            temperature: 0.6,
            max_tokens: 240,
            messages: [
              {
                role: "system",
                content: "You are JARVIS, a crisp, intelligent AI assistant. Answer clearly and concisely in the same language the user asks (English, Hindi, or Hinglish)."
              },
              ...history.slice(-6),
              { role: "user", content: q }
            ]
          })
        });

        const data = await res.json();
        if (!res.ok) {
          activeModel = "";
          throw new Error(data?.error?.message || "API request failed");
        }

        const reply = (data.choices?.[0]?.message?.content || "").trim();
        history.push({ role: "user", content: q }, { role: "assistant", content: reply });
        addBubble(reply, "bot");
        sendEspSay(reply, "speaking");
        speak(reply);
        setTimeout(() => sendEspExpression("happy", "none"), 2000);
        statusEl.textContent = `Ready (${model})`;
      } catch (err) {
        addBubble(`Error: ${err.message}`, "bot");
        statusEl.textContent = "Error";
        sendEspExpression("worried", "worried");
      } finally {
        busy = false;
      }
    }

    function toggleMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        statusEl.textContent = "Mic not supported in this browser";
        return;
      }
      if (listening && recognition) {
        recognition.stop();
        return;
      }

      window.speechSynthesis?.cancel();
      const rec = new SR();
      recognition = rec;
      rec.lang = "en-IN";
      rec.continuous = false;
      rec.interimResults = false;
      listening = true;
      micBtn.classList.add("active");
      micBtn.textContent = "Stop";
      statusEl.textContent = "Listening...";

      let done = false;
      rec.onresult = (e) => {
        if (done) return;
        done = true;
        const text = (e.results?.[0]?.[0]?.transcript || "").trim();
        rec.stop();
        if (text) askJarvis(text);
      };

      rec.onerror = (e) => {
        statusEl.textContent = `Mic error: ${e.error}`;
      };

      rec.onend = () => {
        listening = false;
        recognition = null;
        micBtn.classList.remove("active");
        micBtn.textContent = "Mic";
      };

      rec.start();
    }
  </script>
</body>
</html>
