<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS AI</title>
  <style>
    :root {
      --bg: #060a12;
      --panel: #0d1525;
      --accent: #00e5ff;
      --accent2: #2563eb;
      --text: #eaf3ff;
      --muted: #8ea4c2;
      --border: rgba(0, 229, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #102240 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .app {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .inputs-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: flex-end;
    }
    .box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 195px;
      flex: 1;
      max-width: 260px;
    }
    .box input {
      width: 100%;
      background: #070d19;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.84rem;
      outline: none;
    }
    .box input:focus { border-color: var(--accent); }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.ready { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .chat {
      height: 350px;
      overflow-y: auto;
      background: rgba(6, 10, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 84%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff;
    }
    .msg.bot {
      align-self: flex-start;
      background: #111d33;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .composer {
      display: flex;
      gap: 8px;
    }
    .composer input {
      flex: 1;
      background: #070d19;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
