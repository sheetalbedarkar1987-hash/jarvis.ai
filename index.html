<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS AI - Multi Voice</title>
  <style>
    :root {
      --bg: #050911;
      --panel: #0c1424;
      --accent: #00e5ff;
      --accent2: #2563eb;
      --text: #eef5ff;
      --muted: #8ea4c2;
      --border: rgba(0, 229, 255, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #102447 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .app {
      width: 100%;
      max-width: 820px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .top-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: flex-end;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 175px;
      max-width: 240px;
    }
    .field input, .assistant-bar select {
      width: 100%;
      background: #070d19;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.84rem;
      outline: none;
    }
    .field input:focus, .assistant-bar select:focus {
      border-color: var(--accent);
    }
    .assistant-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(7, 13, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .assistant-bar label {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .assistant-bar select {
      flex: 1;
      min-width: 220px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.on {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .chat {
      height: 340px;
      overflow-y: auto;
      background: rgba(5, 9, 17, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #ffffff;
    }
    .msg.bot {
      align-self: flex-start;
      background: #111d33;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .composer {
      display: flex;
      gap: 8px;
    }
    .composer input {
      flex: 1;
      background: #070d19;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      outline: none;
    }
    .composer input:focus {
      border-color: var(--accent);
    }
    button {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #03101d;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    button.mic, button.small-btn {
      background: #132038;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 7px 12px;
      font-size: 0.82rem;
    }
    button.mic.active {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title" id="brandTitle">JARVIS AI</div>
      <div class="top-inputs">
        <div class="field">
          <span class="dot" id="keyDot" title="API Key"></span>
          <input id="apiKey" type="password" placeholder="Put your API key" />
        </div>
        <div class="field">
          <span class="dot" id="localDot" title="ESP32 Local Address"></span>
          <input id="localAddr" type="text" placeholder="Put your local address" />
        </div>
      </div>
    </div>

    <div class="assistant-bar">
      <label for="assistantSelect">Assistant Voice:</label>
      <select id="assistantSelect"></select>
      <button class="small-btn" id="testVoiceBtn" type="button">Test Voice</button>
      <button class="small-btn" id="voiceBtn" type="button">Voice: ON</button>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">JARVIS online. Choose any of the 10 voices above, put your API key, and ask in Hindi or English!</div>
    </div>

    <div class="composer">
      <button class="mic" id="micBtn" type="button">Mic</button>
      <input id="prompt" type="text" placeholder="Ask in English, Hindi, or Hinglish..." />
      <button id="sendBtn" type="button">Send</button>
    </div>

    <div class="footer-bar">
      <span id="voiceInfo">Language: Auto (Hindi + English)</span>
      <span id="status">Waiting for API key</span>
    </div>
  </div>

  <script>
    const ASSISTANTS = [
      {
        id: "jarvis",
        name: "1. JARVIS (Boy - Deep AI Tone)",
        gender: "male",
        pitch: 0.68,
        rate: 0.94,
        sample: "Hello! I am JARVIS. नमस्ते, मैं जार्विस हूँ और आपकी मदद के लिए तैयार हूँ।"
      },
      {
        id: "aarav",
        name: "2. Aarav (Boy - Clear Indian)",
        gender: "male",
        pitch: 0.92,
        rate: 1.0,
        sample: "Hi, I am Aarav. नमस्ते, मैं आरव बोल रहा हूँ, बताइए क्या काम है?"
      },
      {
        id: "vikram",
        name: "3. Vikram (Boy - Heavy Commander)",
        gender: "male",
        pitch: 0.60,
        rate: 0.88,
        sample: "Vikram reporting. नमस्ते, मैं विक्रम हूँ। आदेश दीजिए।"
      },
      {
        id: "kabir",
        name: "4. Kabir (Boy - Fast & Energetic)",
        gender: "male",
        pitch: 1.02,
        rate: 1.12,
        sample: "Hey! I am Kabir. नमस्ते, मैं कबीर हूँ, चलो शुरू करते हैं!"
      },
      {
        id: "rohan",
        name: "5. Rohan (Boy - Friendly Soft)",
        gender: "male",
        pitch: 1.08,
        rate: 0.97,
        sample: "Hello friend, I am Rohan. नमस्ते दोस्त, मैं रोहन हूँ।"
      },
      {
        id: "friday",
        name: "6. FRIDAY (Girl - Smart AI)",
        gender: "female",
        pitch: 1.15,
        rate: 1.0,
        sample: "Systems online. I am FRIDAY. नमस्ते, मैं फ्राइडे हूँ, सब तैयार है।"
      },
      {
        id: "ananya",
        name: "7. Ananya (Girl - Sweet & Clear)",
        gender: "female",
        pitch: 1.24,
        rate: 0.98,
        sample: "Hello! I am Ananya. नमस्ते, मैं अनन्या बोल रही हूँ।"
      },
      {
        id: "diya",
        name: "8. Diya (Girl - Lively High)",
        gender: "female",
        pitch: 1.35,
        rate: 1.08,
        sample: "Hi there! I am Diya. नमस्ते, मैं दीया हूँ, क्या पूछना है?"
      },
      {
        id: "meera",
        name: "9. Meera (Girl - Calm & Gentle)",
        gender: "female",
        pitch: 1.10,
        rate: 0.90,
        sample: "Greetings, I am Meera. नमस्ते, मैं मीरा हूँ, शांति से बात करते हैं।"
      },
      {
        id: "zara",
        name: "10. Zara (Girl - Modern Crisp)",
        gender: "female",
        pitch: 1.28,
        rate: 1.05,
        sample: "Hey! Zara here. नमस्ते, मैं ज़ारा हूँ, तुरंत जवाब मिलेगा।"
      }
    ];

    const apiKeyEl = document.getElementById("apiKey");
    const localAddrEl = document.getElementById("localAddr");
    const keyDot = document.getElementById("keyDot");
    const localDot = document.getElementById("localDot");
    const chatEl = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const statusEl = document.getElementById("status");
    const micBtn = document.getElementById("micBtn");
    const sendBtn = document.getElementById("sendBtn");
    const voiceBtn = document.getElementById("voiceBtn");
    const assistantSelect = document.getElementById("assistantSelect");
    const testVoiceBtn = document.getElementById("testVoiceBtn");
    const brandTitle = document.getElementById("brandTitle");
    const voiceInfo = document.getElementById("voiceInfo");

    let busy = false;
    let listening = false;
    let voiceEnabled = true;
    let recognition = null;
    let activeModel = "";
    let cachedVoices = [];
    let history = [];

    // Populate 10 Assistants
    ASSISTANTS.forEach((a) => {
      const opt = document.createElement("option");
      opt.value = a.id;
      opt.textContent = a.name;
      assistantSelect.appendChild(opt);
    });

    const savedAssistant = localStorage.getItem("jarvis_assistant") || "jarvis";
    assistantSelect.value = ASSISTANTS.some((a) => a.id === savedAssistant) ? savedAssistant : "jarvis";
    updateBrandHeader();

    function getCurrentAssistant() {
      return ASSISTANTS.find((a) => a.id === assistantSelect.value) || ASSISTANTS[0];
    }

    function updateBrandHeader() {
      const current = getCurrentAssistant();
      const shortName = current.name.split(".")[1].split("(")[0].trim().toUpperCase();
      brandTitle.textContent = shortName + " AI";
    }

    assistantSelect.addEventListener("change", () => {
      localStorage.setItem("jarvis_assistant", assistantSelect.value);
      updateBrandHeader();
      const current = getCurrentAssistant();
      speakText(current.sample);
    });

    testVoiceBtn.addEventListener("click", () => {
      const current = getCurrentAssistant();
      speakText(current.sample);
    });

    if ("speechSynthesis" in window) {
      const loadVoices = () => {
        cachedVoices = window.speechSynthesis.getVoices() || [];
      };
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    apiKeyEl.value = localStorage.getItem("jarvis_api_key") || "";
    localAddrEl.value = localStorage.getItem("jarvis_local_addr") || "";
    updateLocalDot();
    if (apiKeyEl.value.trim().length > 10) {
      detectModel();
    }

    apiKeyEl.addEventListener("input", () => {
      const val = apiKeyEl.value.trim();
      localStorage.setItem("jarvis_api_key", val);
      activeModel = "";
      if (val.length > 10) {
        detectModel();
      } else {
        keyDot.classList.remove("on");
        statusEl.textContent = "Put your API key above";
      }
    });

    localAddrEl.addEventListener("input", () => {
      localStorage.setItem("jarvis_local_addr", localAddrEl.value.trim());
      updateLocalDot();
    });

    voiceBtn.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      voiceBtn.textContent = voiceEnabled ? "Voice: ON" : "Voice: OFF";
      if (!voiceEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    });

    sendBtn.addEventListener("click", () => askJarvis());
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") askJarvis();
    });
    micBtn.addEventListener("click", toggleMic);

    function updateLocalDot() {
      const hasAddr = localAddrEl.value.trim().length >= 7;
      localDot.classList.toggle("on", hasAddr);
    }

    function normalizeUrl(raw) {
      let url = (raw || "").trim().replace(/\/+$/, "");
      if (!url) return "";
      if (!/^https?:\/\//i.test(url)) {
        url = "http://" + url;
      }
      return url;
    }

    async function espPost(path, payload) {
      const base = normalizeUrl(localAddrEl.value);
      if (!base) return;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2500);
      try {
        await fetch(base + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
      } catch (_) {
      } finally {
        clearTimeout(timer);
      }
    }

    function sendEspExpression(expression, sound) {
      espPost("/api/expression", {
        expression: expression || "neutral",
        sound: sound || "none"
      });
    }

    function sendEspSay(text) {
      const safeOled = String(text || "")
        .replace(/[^\x20-\x7E]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 72) || "JARVIS";
      espPost("/api/say", {
        text: safeOled,
        header: "JARVIS",
        expression: "speaking",
        sound: "ai",
        duration: 8000
      });
    }

    async function detectModel() {
      const key = apiKeyEl.value.trim();
      if (!key) return "";
      if (activeModel) return activeModel;

      statusEl.textContent = "Connecting...";
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": "Bearer " + key }
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error((data && data.error && data.error.message) || "Invalid API key");
        }

        const ids = (data.data || []).map((m) => m.id).filter(Boolean);
        const chatModels = ids.filter(
          (id) => !/whisper|guard|tts|orpheus|embed|playai/i.test(id)
        );
        const preferred = [
          "openai/gpt-oss-20b",
          "openai/gpt-oss-120b",
          "llama-3.3-70b-versatile",
          "qwen/qwen3-32b",
          "llama-3.1-8b-instant"
        ];
        activeModel =
          preferred.find((p) => chatModels.includes(p)) ||
          chatModels[0] ||
          "openai/gpt-oss-20b";

        keyDot.classList.add("on");
        statusEl.textContent = "Ready (" + activeModel + ")";
        return activeModel;
      } catch (err) {
        keyDot.classList.remove("on");
        statusEl.textContent = "Key error: " + err.message;
        return "";
      }
    }

    function addBubble(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function pickBestVoice(isHindi, gender) {
      const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
      if (!voices.length) return null;

      const femaleHints = /female|zira|heera|kalpana|swara|neerja|aria|jenny|samantha|google हिन्दी|google uk english female/i;
      const maleHints = /male|david|ravi|hemant|madhur|prabhat|george|daniel|mark|google uk english male/i;

      if (isHindi) {
        const hindiVoices = voices.filter((v) => /hi|hindi|हिन्दी/i.test(v.lang + " " + v.name));
        if (hindiVoices.length) {
          const genderMatch = hindiVoices.find((v) =>
            gender === "female" ? femaleHints.test(v.name) : maleHints.test(v.name)
          );
          return genderMatch || hindiVoices[0];
        }
        const indianVoices = voices.filter((v) => /in/i.test(v.lang));
        if (indianVoices.length) return indianVoices[0];
      }

      const enVoices = voices.filter((v) => /^en/i.test(v.lang));
      const pool = enVoices.length ? enVoices : voices;
      const genderMatch = pool.find((v) =>
        gender === "female" ? femaleHints.test(v.name) : maleHints.test(v.name)
      );
      return genderMatch || pool[0];
    }

    function speakText(text) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;
      const clean = String(text || "")
        .replace(/[*#`_~]/g, "")
        .replace(/\s+/g, " ")
        .trim();
      if (!clean) return;

      window.speechSynthesis.cancel();

      const assistant = getCurrentAssistant();
      // Split sentences so Hindi (Devanagari) and English parts speak smoothly
      const chunks = clean.match(/[^।.!?]+[।.!?]*/g) || [clean];

      chunks.forEach((chunk) => {
        const part = chunk.trim();
        if (!part) return;
        const isHindi = /[\u0900-\u097F]/.test(part);
        const u = new SpeechSynthesisUtterance(part);
        u.lang = isHindi ? "hi-IN" : "en-IN";
        u.pitch = assistant.pitch;
        u.rate = assistant.rate;

        const chosenVoice = pickBestVoice(isHindi, assistant.gender);
        if (chosenVoice) {
          u.voice = chosenVoice;
        }
        voiceInfo.textContent = `Voice: ${assistant.name.split(".")[1].trim()} | Lang: ${isHindi ? "Hindi (hi-IN)" : "English (en-IN)"}`;
        window.speechSynthesis.speak(u);
      });
    }

    async function askJarvis(spokenText) {
      if (busy) return;
      const q = (spokenText || promptEl.value || "").trim();
      if (!q) return;

      const key = apiKeyEl.value.trim();
      if (!key) {
        addBubble("Pehle upar 'Put your API key' mein apni Groq API key paste karo.", "bot");
        return;
      }

      if (!spokenText) promptEl.value = "";
      busy = true;
      addBubble(q, "user");
      statusEl.textContent = "Thinking...";
      sendEspExpression("thinking", "think");

      try {
        const model = await detectModel();
        if (!model) {
          throw new Error("API key invalid ya expire hai. Nayi Groq API key daalo.");
        }

        const assistant = getCurrentAssistant();
        const shortName = assistant.name.split(".")[1].split("(")[0].trim();

        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + key
          },
          body: JSON.stringify({
            model: model,
            temperature: 0.6,
            max_tokens: 240,
            messages: [
              {
                role: "system",
                content:
                  `You are ${shortName}, a smart and helpful AI assistant. Reply clearly in 1 to 3 concise sentences in the exact same language or script the user asks in (Hindi Devanagari, English, or Hinglish). Avoid emojis so text-to-speech reads smoothly.`
              },
              ...history.slice(-6),
              { role: "user", content: q }
            ]
          })
        });

        const data = await res.json();
        if (!res.ok) {
          activeModel = "";
          throw new Error((data && data.error && data.error.message) || "API request failed");
        }

        const reply =
          (data.choices &&
            data.choices[0] &&
            data.choices[0].message &&
            data.choices[0].message.content ||
            "").trim() || "No response received.";

        history.push({ role: "user", content: q });
        history.push({ role: "assistant", content: reply });

        addBubble(reply, "bot");
        sendEspSay(reply);
        speakText(reply);
        setTimeout(() => sendEspExpression("happy", "none"), 2200);
        statusEl.textContent = "Ready (" + model + ")";
      } catch (err) {
        addBubble("Error: " + err.message, "bot");
        statusEl.textContent = "Error";
        sendEspExpression("worried", "worried");
      } finally {
        busy = false;
      }
    }

    function toggleMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        statusEl.textContent = "Mic is browser mein supported nahi hai";
        return;
      }

      if (listening && recognition) {
        recognition.stop();
        return;
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      const rec = new SR();
      recognition = rec;
      rec.lang = "hi-IN";
      rec.continuous = false;
      rec.interimResults = false;

      listening = true;
      micBtn.classList.add("active");
      micBtn.textContent = "Stop";
      statusEl.textContent = "Listening (Hindi / English)...";

      let done = false;
      rec.onresult = (event) => {
        if (done) return;
        done = true;
        const transcript = (
          (event.results &&
            event.results[0] &&
            event.results[0][0] &&
            event.results[0][0].transcript) ||
          ""
        ).trim();
        rec.stop();
        if (transcript) {
          askJarvis(transcript);
        }
      };

      rec.onerror = (event) => {
        statusEl.textContent = "Mic error: " + event.error;
      };

      rec.onend = () => {
        listening = false;
        recognition = null;
        micBtn.classList.remove("active");
        micBtn.textContent = "Mic";
      };

      rec.start();
    }
  </script>
</body>
</html>
